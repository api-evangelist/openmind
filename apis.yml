aid: openmind
name: OpenMind
description: >-
  OpenMind builds open-source software that makes robots useful. Its flagship
  product, OM1, is a modular AI Hardware Abstraction Layer (HAL) and agent
  runtime for robots that unifies perception, LLM reasoning, and action across
  hardware platforms such as the Unitree Go2 quadruped, Unitree G1 humanoid,
  TurtleBot4, Raspberry Pi, and Tesla. OpenMind operates a cloud API at
  api.openmind.com that provides a unified multi-provider LLM endpoint (OpenAI,
  Anthropic via OpenRouter, Google Gemini, X.AI, DeepSeek, NEAR.AI), speech
  services (Google/ElevenLabs ASR, ElevenLabs/Riva TTS), a ViLA vision-language
  model, and account/API-key management. Usage is metered in OMCU (OpenMind
  Computational Units) across free, standard, builder, pro, and enterprise
  plans. Premium REST APIs (Orchestrator and Nav2) provide remote SLAM,
  navigation, patrol, docking, and map management for the OM1 ROS2 SDK. OpenMind
  is backed by Pantera Capital and also develops the FABRIC decentralized robot
  coordination layer and Asimov blockchain-based governance for robots.
